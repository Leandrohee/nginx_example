events{}

http {

    log_format debug_format 'LOG_DEBUG: '
                    'remote=$remote_addr | '
                    'realip_remote_addr=$realip_remote_addr | '
                    'xff=$http_x_forwarded_for | '
                    'proxy_xff=$proxy_add_x_forwarded_for | '
                    'method=$request_method | '
                    'uri=$uri | '
                    'args=$args | '
                    'request_uri=$request_uri | '
                    'status=$status | '
                    'upstream_addr=$upstream_addr | '
                    'up_status=$upstream_status | '
                    'up_response_length=$upstream_response_length | '
                    'host=$host | '
                    'http_host=$http_host | '
                    'server_name=$server_name | '
                    'scheme=$scheme | '
                    'request=$request | '
                    'proxy_host=$proxy_host | '
                    'upstream_http_location=$upstream_http_location | '
                    'sent_http_location=$sent_http_location | '
                    'rt=$request_time | '
                    'urt=$upstream_response_time | '
                    'body_bytes_sent=$body_bytes_sent | '
                    'http_referer=$http_referer | '
                    'http_user_agent=$http_user_agent';


    # Definindo um DNS interno ara o docker
    resolver 127.0.0.11 valid=30s;  

    server {
        listen 4000;

        #Logs customizados
        access_log /var/log/nginx/access.log debug_format;
        access_log /dev/stdout debug_format;

        # OPCAO 1 - COM VARIAVEL
        location / {
            set $python_server_dinamic_ip python_server_service:1111;
            proxy_pass http://$python_server_dinamic_ip$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OPCAO 2 - SEM VARIAVEL 
        # location / {
        #     proxy_pass http://python_server_service:1111/;

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

    }
}