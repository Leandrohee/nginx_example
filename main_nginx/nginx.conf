events{}

http {

    log_format debug_format 'LOG_DEBUG: '
                'remote=$remote_addr | '
                'method=$request_method | '
                'uri=$uri | '
                'args=$args | '
                'request_uri=$request_uri | '
                'status=$status | '
                'upstream_addr=$upstream_addr | '
                'up_status=$upstream_status | '
                'up_response_length=$upstream_response_length | '
                'host=$host | '
                'http_host=$http_host | '
                'server_name=$server_name | '
                'scheme=$scheme | '
                'request=$request | '
                'proxy_host=$proxy_host | '
                'upstream_http_location=$upstream_http_location | '
                'sent_http_location=$sent_http_location | '
                'rt=$request_time | '
                'urt=$upstream_response_time | '
                'body_bytes_sent=$body_bytes_sent | '
                'http_referer=$http_referer | '
                'http_user_agent=$http_user_agent';

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }

    server {

        #Logs customizados
        access_log /var/log/nginx/access.log debug_format;
        access_log /dev/stdout debug_format;

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

        location /banana/ {
            # proxy_pass http://127.0.0.1:2000/; # this is for linux
            proxy_pass http://host.docker.internal:2000/; # this is for mac
        }

        location /node/ {
            # proxy_pass http://127.0.0.1:2001/; # this is for linux
            proxy_pass http://host.docker.internal:2001/; # This is for mac
        }

        location /python/ {
            # proxy_pass http://127.0.0.1:2002/; # this is for linux
            proxy_pass http://host.docker.internal:2002/; # This is for mac
        }

    }
}

