events{}

http {

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

        location /banana/ {
            #proxy_pass http://127.0.0.1:2000/; # this is for linux
            proxy_pass http://host.docker.internal:2000/;
        }

        location /umami/ {
            #proxy_pass http://127.0.0.1:2001/; # this is for linux
            proxy_pass http://host.docker.internal:2001/;
        }
    }
}

