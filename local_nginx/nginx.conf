events{}

http {
    log_format debug_format 'LOG_DEBUG: remote=$remote_addr | method=$request_method | '
                    'uri=$uri | status=$status | upstream_addr=$upstream_addr | '
                    'up_status=$upstream_status | host=$host | '
                    'rt=$request_time | urt=$upstream_response_time |';


    resolver 127.0.0.11 valid=30s;  

    server {
        listen 4000;

        #Logs customizados
        access_log /var/log/nginx/access.log debug_format;
        access_log /dev/stdout debug_format;

        location / {
            return 200 "Banana inside the local nginx";
        }

        location /backend/ {

            # rewrite ^/backend/(.*) /$1 break;
            # set $python_dinamic_ip python_server_service:1111;
            proxy_pass http://python_server_service:1111/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
}